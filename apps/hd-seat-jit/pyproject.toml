[project]
name = "hd-seat-jit"
version = "0.1.0"
description = "현대시트 2시간 작업지시서 연동 앱"
requires-python = ">=3.12"
dependencies = [
    "gc-rpa-core",
    "openpyxl>=3.1",
    "selenium>=4.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hd_seat_jit"]
