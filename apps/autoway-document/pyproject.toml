[project]
name = "autoway-document"
version = "0.1.0"
description = "오토웨이 결재 문서 연동 앱"
requires-python = ">=3.12"
dependencies = [
    "gc-rpa-core",
    "gc-rpa-autoway",
    "selenium>=4.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoway_document"]
