[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
gc-rpa-core = { workspace = true }
gc-rpa-autoway = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "pyinstaller>=6.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/*/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["apps/*/src", "packages/*/src"]
exclude = ["/tests/", "/build/", "/dist/"]

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = "-ra --import-mode=importlib"
