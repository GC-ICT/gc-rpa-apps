[project]
name = "gc-rpa-autoway"
version = "0.1.0"
description = "오토웨이 사이트 공용 코드"
requires-python = ">=3.12"
dependencies = [
    "gc-rpa-core",
    "selenium>=4.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_rpa_autoway"]
