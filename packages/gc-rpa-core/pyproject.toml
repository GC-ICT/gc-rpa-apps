[project]
name = "gc-rpa-core"
version = "0.1.0"
description = "앱 공용 코드"
requires-python = ">=3.12"
dependencies = [
    "pymssql>=2.3",
    "python-dotenv>=1.0",
    "selenium>=4.27",
    "pysignalr>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gc_rpa_core"]
